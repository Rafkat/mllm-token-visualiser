[project]
name = "mllm-token-visualiser"
license = "Apache-2.0"
version = "0.3.0"
description = "Token analysis and visualisation for multimodal language models"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "librosa==0.11.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "qwen-vl-utils>=0.0.14,<0.1",
    "rich>=13.0",
    "torch>=2.4",
    "torchaudio==2.11.0",
    "torchcodec>=0.15.0",
    "torchvision==0.28.0",
    "transformers>=5.2,<6",
    "typer>=0.12",
]

[project.optional-dependencies]
omni = [
    "numba>=0.59",
    "qwen-omni-utils>=0.0.9,<0.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.0",
    "pytest>=8.0",
    "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mllm_tokens"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a real Hugging Face processor",
    "media: requires local image, video, or audio decoding",
]
